name: Bug report
description: Report a reproducible problem with synthetic or redacted details.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Never attach real QR exports, passwords, TOTP seeds, OTP values, internal VPN addresses, or raw diagnostic bundles. Report vulnerabilities privately through SECURITY.md.
  - type: input
    id: app_version
    attributes:
      label: VPN Keeper version
      placeholder: "1.1.3"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS / architecture / Cisco version
      placeholder: "macOS 15, Apple Silicon, Cisco Secure Client 5.x"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use a fictional server, username, group, and any necessary synthetic prompt dialogue.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed credentials, QR data, internal hosts, and personal information.
          required: true
